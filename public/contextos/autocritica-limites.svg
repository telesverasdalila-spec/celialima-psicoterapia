<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-autolim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="60%" stop-color="#f4ede1"/>
      <stop offset="100%" stop-color="#e3dccd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-autolim)"/>
  <!-- Espelho estilizado — autoconhecimento, autocrítica, limites -->
  <g transform="translate(400, 300)">
    <ellipse cx="0" cy="0" rx="100" ry="140" stroke="#a05a3c" stroke-width="2.5" fill="none" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="80" ry="120" stroke="#7a8a5b" stroke-width="1.5" fill="none" opacity="0.4"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#a05a3c" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#a05a3c" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="6" fill="#a05a3c" opacity="0.7"/>
  </g>
</svg>
