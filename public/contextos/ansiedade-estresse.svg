<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-ansiedade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="60%" stop-color="#f4ede1"/>
      <stop offset="100%" stop-color="#e3dccd"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a05a3c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a05a3c" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-ansiedade)"/>
  <!-- Ondas suaves sugerindo respiração -->
  <g transform="translate(400, 300)">
    <path d="M -200,0 Q -100,-60 0,0 T 200,0" stroke="#a05a3c" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M -180,30 Q -90,-30 0,30 T 180,30" stroke="#a05a3c" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M -160,60 Q -80,0 0,60 T 160,60" stroke="#a05a3c" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M -140,-30 Q -70,-90 0,-30 T 140,-30" stroke="#a05a3c" stroke-width="1.5" fill="none" opacity="0.55"/>
    <path d="M -120,-60 Q -60,-120 0,-60 T 120,-60" stroke="#a05a3c" stroke-width="1" fill="none" opacity="0.45"/>
  </g>
</svg>
