<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-corpo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="60%" stop-color="#f4ede1"/>
      <stop offset="100%" stop-color="#e3dccd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-corpo)"/>
  <!-- Folha com veios — símbolo de corpo, saúde e natureza integrativa -->
  <g transform="translate(400, 300)">
    <path d="M 0,-140 Q -120,-80 -120,40 Q -80,140 0,140 Q 80,140 120,40 Q 120,-80 0,-140 Z"
          fill="#a05a3c" opacity="0.18" stroke="#a05a3c" stroke-width="2"/>
    <!-- Veio central -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#a05a3c" stroke-width="1.5" opacity="0.5"/>
    <!-- Veios laterais -->
    <path d="M 0,-100 Q -40,-70 -80,-50 M 0,-60 Q -50,-30 -100,-10 M 0,-20 Q -60,10 -110,30
             M 0,20 Q -60,40 -100,60 M 0,60 Q -50,80 -80,100 M 0,100 Q -30,120 -50,130"
          stroke="#a05a3c" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 0,-100 Q 40,-70 80,-50 M 0,-60 Q 50,-30 100,-10 M 0,-20 Q 60,10 110,30
             M 0,20 Q 60,40 100,60 M 0,60 Q 50,80 80,100 M 0,100 Q 30,120 50,130"
          stroke="#a05a3c" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
</svg>
