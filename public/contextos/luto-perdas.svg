<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-luto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="60%" stop-color="#f4ede1"/>
      <stop offset="100%" stop-color="#e3dccd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-luto)"/>
  <!-- Lua em céu — símbolo do luto e da passagem -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="120" stroke="#a05a3c" stroke-width="2.5" fill="none" opacity="0.45"/>
    <path d="M -60,-80 A 100,100 0 1,0 -60,80 A 80,80 0 1,1 -60,-80"
          fill="#a05a3c" opacity="0.5"/>
    <!-- estrelas/pequenos pontos -->
    <circle cx="-160" cy="-150" r="2" fill="#a05a3c" opacity="0.7"/>
    <circle cx="180" cy="-120" r="2" fill="#a05a3c" opacity="0.6"/>
    <circle cx="140" cy="160" r="2" fill="#a05a3c" opacity="0.5"/>
    <circle cx="-180" cy="140" r="1.5" fill="#a05a3c" opacity="0.6"/>
  </g>
</svg>
